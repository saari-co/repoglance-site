<!doctype html>
<!--
  The Open Graph image of repoglance.com (GrillTrack og-image-009, candidate
  "C Widget cut-out", locked 2026-10-01; design.md v4). A 1200x630 card in
  the decided look: the ink band, the commit-eye rings at 5%, the mark, the
  eyebrow and the hero line from seed/seed.json (injected by
  scripts/og-image.mjs into the two data-seed elements), and the Pinned repos
  widget cut-out the home page already ships. Rendered to public/og-image.png

-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>repoglance.com Open Graph image</title>
    <style>
      :root { --ink: #1b1d21; --fg: #ffffff; --muted: #c9ced6; --line: #4a4f57; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: #000; }
      .card { position: relative; width: 1200px; height: 630px; overflow: hidden; background: var(--ink); color: var(--fg); font-family: var(--sans); line-height: 1.12; -webkit-font-smoothing: antialiased; }

      .brand svg { width: 46px; height: 46px; display: block; }
      .copy { position: absolute; left: 72px; width: 600px; top: 190px; }
      .eyebrow { font-family: var(--mono); font-size: 22px; color: var(--muted); margin: 0 0 22px; }
      h1 { margin: 0; font-size: 58px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; text-wrap: balance; }
      .widget { position: absolute; left: 720px; top: 184px; width: 420px; height: 262px; border-radius: 26px; overflow: hidden; border: 1px solid var(--line); box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35); }
      .widget img { display: block; width: 420px; height: auto; }
      .domain { position: absolute; left: 72px; bottom: 60px; font-family: var(--mono); font-size: 22px; color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="card">

      <div class="brand">

        <span>RepoGlance</span>

      <div class="copy">
        <p class="eyebrow" data-seed="eyebrow">Read-only GitHub widgets for Pixel</p>
